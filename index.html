<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TD Anime AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #090914;
            color: white;
        }

        header {
            text-align: center;
            padding: 35px 15px 20px;
        }

        header h1 {
            font-size: 38px;
            margin-bottom: 8px;
        }

        header p {
            color: #aaa;
        }

        .container {
            width: 92%;
            max-width: 850px;
            margin: auto;
        }

        .card {
            background: #151522;
            border: 1px solid #29293b;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #242438;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .tab.active {
            background: #7c4dff;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            min-height: 130px;
            resize: vertical;
            border: 0;
            outline: none;
            border-radius: 12px;
            padding: 14px;
            background: #0d0d18;
            color: white;
            font-size: 16px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            background: #0d0d18;
            color: #bbb;
            border-radius: 10px;
        }

        .preview-image {
            width: 100%;
            max-height: 350px;
            object-fit: contain;
            margin-top: 15px;
            border-radius: 12px;
            display: none;
        }

        .generate {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            border: 0;
            border-radius: 12px;
            background: #7c4dff;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .generate:hover {
            background: #6339d8;
        }

        .status {
            text-align: center;
            color: #aaa;
            margin-top: 15px;
        }

        .video-area {
            background: #07070d;
            border-radius: 14px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video {
            width: 100%;
            max-height: 500px;
            display: none;
        }

        .download {
            display: none;
            width: 100%;
            text-align: center;
            padding: 14px;
            margin-top: 15px;
            border-radius: 10px;
            background: #159957;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        footer {
            text-align: center;
            color: #666;
            padding: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>🎬 TD Anime AI</h1>
    <p>Create anime videos from text or images</p>
</header>

<div class="container">

    <div class="card">

        <div class="tabs">

            <button
                class="tab active"
                id="textTab"
                onclick="selectMode('text')">
                ✨ Text → Video
            </button>

            <button
                class="tab"
                id="imageTab"
                onclick="selectMode('image')">
                🖼️ Image → Video
            </button>

        </div>

        <div id="textMode">

            <label>Anime Video Prompt</label>

            <textarea
                id="prompt"
                placeholder="Example: Anime boy walking through a Japanese forest at sunset, cinematic camera movement, beautiful lighting..."
            ></textarea>

        </div>

        <div id="imageMode" class="hidden">

            <label>Select an Image</label>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
                onchange="previewImage()"
            >

            <img
                id="imagePreview"
                class="preview-image"
            >

            <label>Animation Prompt</label>

            <textarea
                id="imagePrompt"
                placeholder="Example: Make the character slowly walk forward while the camera moves around him..."
            ></textarea>

        </div>

        <button
            class="generate"
            onclick="generateVideo()">
            🚀 Generate Anime Video
        </button>

        <div class="status" id="status">
            Ready
        </div>

    </div>

    <div class="card">

        <h2>🎥 Video Result</h2>

        <br>

        <div class="video-area">

            <span id="videoPlaceholder">
                Generated video will appear here
            </span>

            <video
                id="resultVideo"
                controls>
            </video>

        </div>

        <a
            id="downloadButton"
            class="download"
            download="td-anime-video.mp4">
            ⬇️ Download Anime Video
        </a>

    </div>

</div>

<footer>
    TD Anime AI © 2026
</footer>

<script>

let currentMode = "text";


function selectMode(mode) {

    currentMode = mode;

    const textMode = document.getElementById("textMode");
    const imageMode = document.getElementById("imageMode");

    const textTab = document.getElementById("textTab");
    const imageTab = document.getElementById("imageTab");

    if (mode === "text") {

        textMode.classList.remove("hidden");
        imageMode.classList.add("hidden");

        textTab.classList.add("active");
        imageTab.classList.remove("active");

    } else {

        textMode.classList.add("hidden");
        imageMode.classList.remove("hidden");

        textTab.classList.remove("active");
        imageTab.classList.add("active");
    }
}


function previewImage() {

    const file =
        document.getElementById("imageInput").files[0];

    const preview =
        document.getElementById("imagePreview");

    if (!file) return;

    const imageURL =
        URL.createObjectURL(file);

    preview.src = imageURL;
    preview.style.display = "block";
}


async function generateVideo() {

    const status =
        document.getElementById("status");

    const video =
        document.getElementById("resultVideo");

    const placeholder =
        document.getElementById("videoPlaceholder");

    const downloadButton =
        document.getElementById("downloadButton");


    let prompt = "";


    // Text → Video
    if (currentMode === "text") {

        prompt =
            document.getElementById("prompt")
            .value
            .trim();

        if (!prompt) {

            alert(
                "Please enter an anime video prompt."
            );

            return;
        }

    }


    // Image → Video
    else {

        alert(
            "Image → Video will be connected in the next step."
        );

        return;
    }


    status.innerText =
        "⏳ Sending prompt to AI...";

    downloadButton.style.display =
        "none";

    video.style.display =
        "none";

    placeholder.style.display =
        "block";


    try {

        const response =
            await fetch(
                "https://red-glade-de2ftdanime-api.thanujadarshana2000.workers.dev",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        prompt: prompt
                    })
                }
            );


        const data =
            await response.json();


        console.log(
            "AI Response:",
            data
        );


        if (!response.ok) {

            throw new Error(
                data.error ||
                "AI generation failed"
            );
        }


        // Replicate completed video
        if (data.output) {

            video.src =
                data.output;

            video.style.display =
                "block";

            placeholder.style.display =
                "none";

            downloadButton.href =
                data.output;

            downloadButton.style.display =
                "block";

            status.innerText =
                "✅ Anime video generated!";

        }

        else {

            status.innerText =
                "⏳ Video generation is still processing.";

            console.log(
                "Prediction:",
                data
            );
        }


    } catch (error) {

        console.error(error);

        status.innerText =
            "❌ " + error.message;
    }

}

        status.innerText =
            "⏳ Your prompt is ready for the AI video generator.";

    } else {

        const image =
            document.getElementById("imageInput").files[0];

        const prompt =
            document.getElementById("imagePrompt").value.trim();

        if (!image) {

            alert("Please upload an image.");

            return;
        }

        if (!prompt) {

            alert("Please enter an animation prompt.");

            return;
        }

        status.innerText =
            "⏳ Your image and prompt are ready for the AI video generator.";
    }

    /*
       IMPORTANT:

       The real AI video API will be connected here later.

       We will NOT put any private API key directly
       inside this HTML file.
    */
}

</script>

</body>
</html>
