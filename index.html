<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anime Video Generator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #0b0b16;
            color: white;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        h1 {
            text-align: center;
            font-size: 38px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        .card {
            background: #151525;
            border: 1px solid #292943;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            min-height: 130px;
            resize: vertical;
            border: none;
            outline: none;
            border-radius: 12px;
            padding: 15px;
            background: #0d0d19;
            color: white;
            font-size: 16px;
        }

        input[type="file"] {
            width: 100%;
            margin-top: 5px;
            padding: 12px;
            background: #0d0d19;
            border-radius: 10px;
            color: #ccc;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #7c4dff;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #6338d8;
        }

        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #08080f;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .download {
            display: none;
            text-align: center;
            text-decoration: none;
            background: #16a085;
            padding: 14px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            margin-top: 15px;
        }

        .status {
            text-align: center;
            margin-top: 15px;
            color: #aaa;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 28px;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎬 Anime Video Generator</h1>

    <p class="subtitle">
        Create amazing anime videos with AI
    </p>

    <div class="card">

        <label for="prompt">✨ Describe your video</label>

        <textarea
            id="prompt"
            placeholder="Example: Anime boy walking through a beautiful Japanese forest at sunset, cinematic camera movement..."
        ></textarea>

        <br><br>

        <label for="image">🖼️ Upload an image (optional)</label>

        <input
            type="file"
            id="image"
            accept="image/*"
        >

        <button onclick="generateVideo()">
            🚀 Generate Anime Video
        </button>

        <p class="status" id="status">
            Ready to generate
        </p>

    </div>

    <div class="card">

        <h2>🎥 Generated Video</h2>

        <br>

        <div class="video-box" id="videoBox">
            Your generated video will appear here
        </div>

        <a
            id="downloadBtn"
            class="download"
            download="anime-video.mp4"
        >
            ⬇️ Download Video
        </a>

    </div>

</div>

<script>

function generateVideo() {

    const prompt = document.getElementById("prompt").value.trim();
    const status = document.getElementById("status");

    if (!prompt) {
        alert("Please enter a video description first.");
        return;
    }

    status.innerText = "⏳ AI video generation will start here...";

    /*
       AI VIDEO API will be connected here later.

       For now this is only the website interface.
    */

    setTimeout(() => {
        status.innerText =
            "✅ Website is working! AI generator will be connected in the next step.";
    }, 1000);
}

</script>

</body>
</html>
